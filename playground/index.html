<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@jacktea/img-viewer - Playground</title>
  <meta name="description" content="图片预览组件演示 - 支持轮播、幻灯片、相册模式" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --text: #e8e8f0;
      --text-muted: #8888a0;
      --accent: #6c63ff;
      --accent-hover: #7f78ff;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .app-header {
      text-align: center;
      padding: 20px 20px 24px;
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.08) 0%, transparent 100%);
    }

    .app-header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #48c6ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 14px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 0 20px;
      margin-bottom: 0px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius) var(--radius) 0 0;
      transition: all 0.3s;
      position: relative;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      color: var(--accent);
      background: var(--bg-card);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }

    /* Tab Content */
    .tab-panel {
      display: none;
      padding: 0 20px 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tab-panel.active { display: block; }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(108, 99, 255, 0.1);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(108, 99, 255, 0.25);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
    }

    /* Viewer Container */
    .viewer-container {
      width: 100%;
      height: 600px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }

    .viewer-container img-viewer {
      width: 100%;
      height: 100%;
    }

    /* URL Input */
    .url-input {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .url-input::placeholder { color: var(--text-muted); }

    @media (max-width: 768px) {
      .viewer-container { height: 400px; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>@jacktea/img-viewer</h1>
    <p>功能丰富的图片预览组件 — 原生 Web Component · Vue · React</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="native">原生组件</button>
    <button class="tab-btn" data-tab="vue">Vue 组件</button>
    <button class="tab-btn" data-tab="react">React 组件</button>
  </div>

  <div class="tab-panel active" id="tab-native">
    <div class="controls">
      <div class="control-group">
        <button class="btn btn-primary" id="btn-open-local">📂 打开本地文件</button>
      </div>
      <div class="control-group">
        <input type="text" class="url-input" id="url-input" placeholder="输入图片 URL..." value="https://picsum.photos/1200/800" />
        <button class="btn" id="btn-open-url">🌐 加载远程图片</button>
      </div>
      <div class="control-group">
        <button class="btn" id="btn-load-multiple">🖼️ 加载多张图片</button>
      </div>
      <div class="control-group">
        <label>模式:</label>
        <select id="mode-select">
          <option value="single">单图</option>
          <option value="carousel">轮播图</option>
          <option value="slideshow">幻灯片</option>
          <option value="gallery">相册</option>
        </select>
      </div>
      <div class="control-group">
        <label>
          <input type="checkbox" id="readonly-check" /> 只读模式
        </label>
      </div>
    </div>
    <div class="viewer-container">
      <img-viewer id="native-viewer" theme="dark"></img-viewer>
    </div>
  </div>

  <div class="tab-panel" id="tab-vue">
    <div id="vue-app"></div>
  </div>

  <div class="tab-panel" id="tab-react">
    <div id="react-app"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
