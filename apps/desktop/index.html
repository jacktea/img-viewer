<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImgViewer - 图片浏览器</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="app-header">
    <div class="header-left">
      <button class="header-btn" id="btn-open" title="打开图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>打开</span>
      </button>
      <button class="header-btn" id="btn-ruler" title="标尺">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h20v16H2z"/><path d="M6 4v4M10 4v3M14 4v4M18 4v3"/></svg>
        <span>标尺</span>
      </button>
      <button class="header-btn" id="btn-screenshot" title="截图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        <span>截图</span>
      </button>
    </div>
    <div class="header-center">
      <span class="app-title" id="app-title">ImgViewer</span>
    </div>
    <div class="header-right">
      <span class="image-info" id="image-info"></span>
    </div>
  </header>

  <!-- 主体 -->
  <div class="app-body">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">文件列表</span>
        <span class="sidebar-count" id="sidebar-count">0</span>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </aside>

    <!-- 查看器区域 -->
    <main class="viewer-area">
      <!-- 标尺 -->
      <div class="ruler-container" id="ruler-container" style="display:none;">
        <canvas class="ruler-horizontal" id="ruler-h"></canvas>
        <canvas class="ruler-vertical" id="ruler-v"></canvas>
        <div class="ruler-corner"></div>
      </div>
      <!-- img-viewer -->
      <div class="viewer-wrapper" id="viewer-wrapper">
        <img-viewer id="viewer" theme="dark"></img-viewer>
      </div>
      <!-- 截图覆盖层 -->
      <canvas class="screenshot-overlay" id="screenshot-overlay" style="display:none;"></canvas>
    </main>
  </div>

  <!-- 截图工具条 -->
  <div class="screenshot-toolbar" id="screenshot-toolbar" style="display:none;">
    <button class="stool-btn active" data-tool="rect" title="矩形选区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
    </button>
    <button class="stool-btn" data-tool="circle" title="圆形选区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="stool-btn" data-tool="freehand" title="自由涂鸦">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17c3-5 6 2 9-3s6 2 9-3"/></svg>
    </button>
    <div class="stool-divider"></div>
    <button class="stool-btn" id="btn-screenshot-save" title="保存截图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="stool-btn" id="btn-screenshot-cancel" title="取消">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- 欢迎页 -->
  <div class="welcome-overlay" id="welcome-overlay">
    <div class="welcome-content">
      <div class="welcome-icon">🖼️</div>
      <h2>ImgViewer</h2>
      <p>打开图片文件开始浏览</p>
      <button class="welcome-btn" id="btn-welcome-open">📂 打开图片</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
